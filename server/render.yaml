services:
  - type: web
    name: caption-generator-webhook
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Paste the private half from `node generate-keys.js` here.
      - key: LICENSE_PRIVATE_KEY_B64
        sync: false
      - key: CORS_ORIGIN
        value: ""
