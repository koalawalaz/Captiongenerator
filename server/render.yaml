databases:
  - name: caption-generator-db
    plan: free

services:
  - type: web
    name: caption-generator-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: caption-generator-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: ""
      - key: ALLOW_DEV_BILLING_STUB
        value: "false"
