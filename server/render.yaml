services:
  - type: web
    name: caption-generator-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      # Paste your Neon connection string here after creating a free
      # database at neon.tech (see server/README.md) — Render's own free
      # Postgres tier expires after ~30 days, Neon's doesn't.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: ""
      - key: ALLOW_DEV_BILLING_STUB
        value: "false"
