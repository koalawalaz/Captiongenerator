services:
  - type: web
    name: caption-generator-webhook
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Paste the private half from `node generate-keys.js` here.
      - key: LICENSE_PRIVATE_KEY_B64
        sync: false
      - key: CORS_ORIGIN
        value: ""
      # Your Gumroad product's permalink — see server/README.md.
      - key: GUMROAD_PRODUCT_PERMALINK
        sync: false
      # Optional — only needed once you're ready to auto-email keys.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: ""
